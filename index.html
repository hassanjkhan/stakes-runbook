<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #FFF9F1; color: #2E2A33;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #1B181F; color: #F3ECE2; } }
  .card {
    width: 100%; max-width: 380px; text-align: center;
  }
  .jar { font-size: 44px; line-height: 1; margin-bottom: 18px; }
  h1 {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px;
  }
  p { margin: 0 0 22px; color: #7A7386; font-size: 15px; }
  @media (prefers-color-scheme: dark) { p { color: #A79FB0; } }
  form { display: flex; flex-direction: column; gap: 10px; }
  input {
    font: inherit; font-size: 16px; padding: 13px 16px; border-radius: 12px;
    border: 1px solid rgba(46,42,51,0.15); background: #fff; color: #2E2A33; text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    input { background: #252129; color: #F3ECE2; border-color: rgba(243,236,226,0.18); }
  }
  input:focus { outline: 2px solid #0FAF82; outline-offset: 1px; border-color: transparent; }
  button {
    font: inherit; font-size: 16px; font-weight: 700; color: #fff; background: #0FAF82;
    border: none; border-radius: 12px; padding: 13px 16px; cursor: pointer;
  }
  button:hover { background: #0B8763; }
  button:disabled { opacity: 0.6; cursor: default; }
  .err { color: #E23F36; font-size: 14px; min-height: 20px; margin: 4px 0 0; }
</style>

function b64(s) {
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

document.getElementById('f').addEventListener('submit', async function (event) {
  event.preventDefault();
  var button = document.getElementById('b');
  var error = document.getElementById('e');
  error.textContent = '';
  button.disabled = true;
  button.textContent = 'Opening…';

  try {
    var material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(document.getElementById('p').value),
      'PBKDF2', false, ['deriveKey']
    );
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    var plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct)
    );
    var html = new TextDecoder().decode(plain);
    try { sessionStorage.setItem('stakes-runbook-open', document.getElementById('p').value); } catch (e) {}
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    error.textContent = 'Wrong password.';
    button.disabled = false;
    button.textContent = 'Open';
    document.getElementById('p').select();
  }
});

// Reopen without retyping within the same tab session.
(function () {
  var saved = null;
  try { saved = sessionStorage.getItem('stakes-runbook-open'); } catch (e) {}
  if (saved) {
    document.getElementById('p').value = saved;
    document.getElementById('f').dispatchEvent(new Event('submit', { cancelable: true }));
  }
})();
</script>
